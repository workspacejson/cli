name: Publish @workspacejson/cli

# ---------------------------------------------------------------------------
# `cli-v*.*.*` tags publish ONLY @workspacejson/cli.
#
# The compatibility package released from this repository has its own publish
# authority (see OWNERSHIP.md) and must never be published by this workflow.
# That is enforced structurally rather than by review: the tag namespaces are
# disjoint, and the publish step is filtered to a single package directory.
#
# Release flow:
#   pnpm changeset version          # bumps packages/cli/package.json + CHANGELOG
#   git commit -am "release: ..." && git push
#   git tag cli-v0.5.0 && git push --tags
#
# The version line continues `agents-audit`, which is frozen at 0.4.4, so this
# package starts at 0.5.0 rather than 0.1.0.
#
# The tag is both the trigger and the source of truth for the version: it is
# validated as clean semver and asserted equal to the manifest before anything
# reaches the registry. A tag that disagrees with the manifest fails the run
# instead of publishing a version nobody named.
#
# Required ENVIRONMENT secret, on the `npm-publish` environment:
#   NPM_TOKEN  npm automation token with publish rights on @workspacejson/cli
#
# Environment, not repository. This distinction is load-bearing and it is what
# failed the 0.6.1 release: GitHub exposes an environment secret only to a job
# that explicitly declares `environment:`. The job did not, so
# `${{ secrets.NPM_TOKEN }}` resolved to the empty string and the credential
# guard below reported a missing token on a repository whose token was
# correctly configured all along. The secret was never the problem; the job was
# simply never in the scope where it exists.
#
# Scoping it to an environment rather than the repository is deliberate: it is
# the same reviewer-gateable boundary the standard's `standard-v*` releases
# publish behind. Moving NPM_TOKEN to a repository secret would "fix" this by
# widening the blast radius of every workflow in the repository, which is the
# opposite of what the environment is for.
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "cli-v*.*.*"

permissions:
  contents: read
  id-token: write # required for the npm provenance attestation

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # `name` is cosmetic — it labels the job in the Actions UI. `environment` is
    # the line that actually admits the job to the scope where NPM_TOKEN exists.
    # They are named alike on purpose, so a reader of a failed run sees the same
    # word in the job label and the environment it needs.
    name: npm-publish
    environment: npm-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The tag name is attacker-influenceable, so it is read from an env var
      # rather than inlined into the shell, and rejected unless it is clean
      # semver — which also guarantees it carries no shell metacharacters for
      # any later step that interpolates it.
      - name: Derive and validate release version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#cli-v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$REF_NAME' is not a valid cli-vX.Y.Z version"
            exit 1
          fi
          MANIFEST="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::tag version $VERSION does not match packages/cli/package.json ($MANIFEST)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing @workspacejson/cli v$VERSION"

      - run: pnpm install --no-frozen-lockfile

      - name: Architecture and clean-room guards
        run: pnpm run check:architecture

      # Build precedes typecheck for the reason recorded in ci.yml: the
      # compatibility package consumes this package's emitted declarations, so
      # on a clean checkout those must exist before tsc can resolve them.
      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm -r test

      # Packs, parses the PACKED manifest, rejects workspace:/file: leakage and
      # unpinned contract dependencies, asserts the declared bin target is
      # actually in the archive, then installs the tarball into a clean project
      # and runs the binary end to end. This measures the bytes that will ship
      # rather than the state of the branch.
      - name: Verify the release tarball
        run: pnpm --filter @workspacejson/cli exec node ../../scripts/verify-package-tarball.mjs

      # Both variables carry the same secret, because two different config
      # layers each want their own name and the wrong one alone is silently
      # useless:
      #
      #   NODE_AUTH_TOKEN — the userconfig `setup-node` writes to $RUNNER_TEMP.
      #   NPM_TOKEN       — the repository's own `.npmrc`, which reads
      #                     `//registry.npmjs.org/:_authToken=${NPM_TOKEN}`.
      #
      # npm's project config outranks the userconfig, so the repo `.npmrc` wins
      # for any command run from the repository root. With NPM_TOKEN unset it
      # does not fall back to the userconfig token — it sends the *literal*
      # string `Bearer ${NPM_TOKEN}`, which the registry rejects as 401. That is
      # exactly how the 0.5.0 release failed, and it reads as a bad credential
      # rather than a misconfigured workflow, which is what made it worth a
      # comment this long.
      - name: Confirm the publish credential reached the runner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/verify-npm-publish-access.mjs

      # npm rather than pnpm, for two reasons: pnpm 9 exposes no --provenance
      # flag, and `pnpm publish` refuses to run on a detached tag checkout
      # unless git checks are disabled wholesale.
      #
      # This substitution was previously justified by "@workspacejson/cli
      # declares no `workspace:` dependencies, so there is nothing for pnpm to
      # rewrite". That claim became FALSE under META-297, which added the
      # private `@workspacejson/mining-core` as a devDependency, and it stayed
      # false until the 0.6.0 publish failed on it at the gate above. The claim
      # was also the wrong shape: it described a string, and pnpm's rewrite
      # turns that string into a version that reads as legitimate.
      #
      # The invariant the gate now asserts is stronger and packer-independent:
      #
      #   the npm-produced manifest is inspected directly, and may contain no
      #   reference to a private workspace package under ANY spelling.
      #
      # That is what makes publishing with npm safe here — not an assumption
      # about which dependencies happen to be declared today.
      #
      # `prepublishOnly` runs again here. That repetition is deliberate: it
      # keeps the gate attached to the package, so a local or future manual
      # publish cannot bypass what CI checks.
      - name: Publish to npm
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      # A publish that npm accepts can still be unusable — wrong files, broken
      # bin, unresolvable dependency. This installs the real published artifact
      # from the registry and runs it, retrying through propagation lag.
      - name: Verify the published package installs and runs
        env:
          WORKSPACEJSON_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/verify-published.mjs @workspacejson/cli
