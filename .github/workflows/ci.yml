name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Architecture and clean-room guards
        run: pnpm run check:architecture

      - name: Architecture guard red tests
        run: node scripts/check-architecture.test.mjs

      # Build precedes typecheck. `agents-audit` consumes @workspacejson/cli's
      # emitted declarations, so on a clean checkout those must exist before tsc
      # can resolve them. pnpm builds in topological order, so the neutral
      # package is built first.
      - name: Build all packages
        run: pnpm -r build

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm -r test

      - name: Verify package tarballs
        run: pnpm run release:verify-packs

      # This repository owns @workspacejson/cli and agents-audit.
      # @workspacejson/spec and @workspacejson/rules are consumed as released
      # dependencies and are verified by workspacejson/standard, not here.
      - name: Validate package exports
        run: |
          node -e "import('@workspacejson/cli')"
          node -e "import('agents-audit')"

      - name: Run the neutral producer on this repo
        run: node packages/cli/dist/cli.js generate --check || true

      - name: Run agents-audit on this repo
        run: node packages/agents-audit-compat/dist/cli.js scan . --fail-on error

  # Compatibility gate. `agents-audit` is a frozen bridge, so anything touching
  # its command surface, exit codes, output or exports is measured against the
  # frozen pre-migration source rather than only against our own tests.
  #
  # Separate job: it clones and builds a second repository, which the unit-test
  # matrix should not pay for, and it does not need the Node matrix.
  parity:
    name: Compatibility parity vs frozen source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The old side is pinned to an immutable commit, so the SHA is a perfect
      # cache key — it can never go stale for the wrong reason. The path must
      # match parity-lib.sh's default: the cache deliberately lives OUTSIDE the
      # working tree so the frozen-source clone never trips the architecture
      # guard (see PR #5); caching the old in-repo path saved nothing.
      - name: Restore frozen-source cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/workspacejson/cli-parity
          key: parity-e47eb1b8556c4f361db9a78190a2f36b400756e8-${{ runner.os }}-node22

      - run: pnpm install --no-frozen-lockfile

      - name: agents-audit runtime parity
        run: migration/parity-agents-audit-runtime.sh

      - name: agents-audit packed-artifact parity
        run: migration/parity-agents-audit-pack.sh

      # The DataHub adapter parity step was removed under META-248. The adapter
      # was extracted to workspacejson/datahub-agent, and OWNERSHIP.md records
      # that its harness travels with it; it now runs there against the
      # DataHub-owned candidate (35/35, plus per-file source identity against
      # this repository's own frozen pre-migration source).
